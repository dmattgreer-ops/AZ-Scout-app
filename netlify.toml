[
build]
  functions = "netlify/functions"

  [
  build.environment
  ]
    NODE_VERSION + "22"

    [
    functions
    ]
      timeout = 30

      [[
      headers
      ]]
        for =/*"
        [
        headers.values
        ]
          x-Frame-Options = "DENY"
          x-content-Type-Options = "nosniff"
          Referrer-Policy = "strict-origin-when-cross-origin"
